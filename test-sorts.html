<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#151a2c" />
    <title>KUROGANE — banc d'essai des sorts</title>
    <style>
      /* Les deux panneaux encadrent la piste : la liste à gauche, l'état à
         droite. Le bas-centre reste libre — c'est là que vit la jauge de
         sprint, et la masquer ferait rater le départ canon. */
      .essai {
        position: fixed;
        z-index: 30;
        padding: 8px;
        border-radius: 10px;
        background: rgba(13, 16, 28, 0.86);
        border: 1px solid #3d4560;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 0.78rem;
        color: #9aa4c0;
        user-select: none;
      }
      #essai { left: 12px; bottom: 12px; width: 208px; }
      #etat { right: 12px; bottom: 12px; width: 178px; }

      .titre {
        font-size: 0.62rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #6b7594;
        margin-bottom: 6px;
      }
      .sort {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 3px 6px;
        border-radius: 6px;
        line-height: 1.5;
      }
      /* Le sort tenu : on doit le repérer d'un coup d'œil pendant la course */
      .sort.on {
        background: rgba(226, 75, 58, 0.26);
        color: #f0e8d8;
        font-weight: 700;
      }
      .marque { margin-left: auto; opacity: 0.5; font-size: 0.7rem; }

      /* Le mode : lancer le sort, ou le SUBIR. C'est toute la raison d'être de
         cette page — donc c'est gros, et ça se voit. */
      .mode { display: flex; gap: 6px; margin: 8px 0 6px; }
      .mode button {
        flex: 1;
        padding: 5px 0;
        border-radius: 6px;
        border: 1px solid #3d4560;
        background: transparent;
        color: #9aa4c0;
        font-family: inherit;
        font-size: 0.72rem;
        cursor: pointer;
      }
      .mode button.on { background: #e24b3a; border-color: #e24b3a; color: #fff; }
      /* La séance : figer la piste, et en sortir. Vert pour « immobile », gris
         pour « quitter » — deux gestes qui n'ont rien à voir avec les sorts. */
      .mode.seance button.on { background: #1d9e75; border-color: #1d9e75; }
      .mode.seance button.sortie { flex: 0 0 62px; }

      .ligne { display: flex; gap: 6px; padding: 2px 6px; line-height: 1.6; }
      .ligne b { color: #f0e8d8; font-weight: 500; }
      .ligne .v { margin-left: auto; color: #f0e8d8; }
      .ligne.eteint { opacity: 0.32; }
      /* Une jauge maigre sous chaque effet actif : on lit le temps qui reste
         d'un coup d'œil, sans déchiffrer un nombre qui défile. */
      .jauge { height: 2px; background: #e24b3a; border-radius: 2px; margin: 0 6px 3px; }

      .aide {
        margin-top: 7px;
        padding-top: 6px;
        border-top: 1px dashed #3d4560;
        font-size: 0.7rem;
        line-height: 1.6;
        color: #6b7594;
      }
      kbd {
        background: #3d4560;
        color: #f0e8d8;
        border-radius: 4px;
        padding: 0 5px;
        font-family: inherit;
        font-size: 0.72rem;
      }

      /* ————— Le banc de mesure —————
         Un sort qui coûte cher ne se voit pas : il se compte. Ce panneau
         rejoue les dix sorts un par un, et compare ce que chaque image coûte
         AVEC lui à ce qu'elle coûte SANS. C'est la moitié « diagnostic » de
         cette page — l'autre moitié, c'est de regarder l'effet. */
      #mesure {
        position: fixed;
        z-index: 31;
        left: 12px;
        top: 12px;
        width: min(560px, calc(100vw - 24px));
        padding: 10px;
        border-radius: 10px;
        background: rgba(13, 16, 28, 0.92);
        border: 1px solid #3d4560;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 0.78rem;
        color: #9aa4c0;
        display: none;
      }
      #mesure.on { display: block; }
      #mesure table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      #mesure th, #mesure td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #3d4560; }
      #mesure th { color: #6b7594; font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; }
      #mesure td.num { text-align: right; }
      #mesure tr.mauvais td { color: #e24b3a; }
      #mesure tr.ok td:last-child { color: #5ef08a; }
      #mesure .suite { color: #6b7594; padding: 4px 6px 0; line-height: 1.6; }
      #mesure .entete { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      #mesure .entete b { color: #f0e8d8; font-weight: 700; }
      #mesure button {
        margin-left: auto; padding: 3px 9px; border-radius: 6px; cursor: pointer;
        border: 1px solid #e24b3a; background: rgba(226, 75, 58, 0.16); color: #f0e8d8;
        font: inherit; font-size: 0.72rem;
      }
      #mesure button:disabled { opacity: 0.4; cursor: default; }
    </style>
  </head>
  <body>
    <script type="module">
      // On CHARGE le vrai index.html plutôt que d'en recopier le balisage : une
      // copie finirait par mentir le jour où l'interface bouge.
      const html = await (await fetch('/index.html')).text()
      const doc = new DOMParser().parseFromString(html, 'text/html')
      document.body.insertAdjacentHTML('afterbegin', doc.body.innerHTML)

      // Les <script> insérés par innerHTML ne s'exécutent pas : c'est nous qui
      // démarrons le jeu, une seule fois, juste ici.
      const { PARCHEMINS, TIRAGE, EFFETS } = await import('/src/parchemin.ts')
      await import('/src/main.ts')

      const guichet = window.__sorts
      if (!guichet) throw new Error('Le guichet de test est absent (build de production ?)')

      const panneau = document.createElement('div')
      panneau.id = 'essai'
      panneau.className = 'essai'
      const etatEl = document.createElement('div')
      etatEl.id = 'etat'
      etatEl.className = 'essai'
      document.body.append(panneau, etatEl)

      let idx = 0
      /*
       * Deux modes, et c'est TOUTE la raison d'être de cette page.
       *
       * « Lancer » joue le sort comme un joueur : les sorts offensifs partent
       * alors chez un rival, et on ne voit rien de leur effet — juste un
       * projectile qui s'éloigne de dos. « Subir » emprunte le chemin
       * d'arrivée, celui qu'un rival déclenche chez nous : on voit enfin la
       * fumée, la boue, les chaînes et le poison SUR SOI.
       *
       * On démarre sur « subir » : c'est ce qu'on vient chercher ici.
       */
      let mode = 'subir'
      /*
       * 🧪 La piste figée : le décor s'arrête, plus rien ne vient te percuter,
       * et tu regardes l'effet posément. Les minuteurs continuent de tourner —
       * sinon on ne verrait jamais comment un sort se dissipe.
       *
       * On démarre FIGÉ : on vient ici pour observer, pas pour courir.
       */
      let fige = true

      // Chaque effet avec sa durée pleine, pour dessiner une jauge honnête.
      const ETATS = [
        ['vent', '🌀 Vent', 1.5],
        ['grue', '🕊️ Grue', 7],
        ['armure', '🛡️ Armure', 2],
        ['miroir', '🪞 Miroir', 8],
        ['the', '🍵 Thé', 3],
        ['kusarigama', '⛓️ Chaînes', 2],
        ['fumigene', '💨 Fumée', 2.5],
        ['senbon', '☠️ Poison', 3],
        ['stumble', '💥 Chute', 1.2],
      ]

      function dessiner() {
        const lignes = TIRAGE.map((k, i) => {
          const p = PARCHEMINS[k]
          // ⚔ = il lui faut une cible pour être LANCÉ. En mode « subir » la
          // distinction disparaît : tout retombe sur nous.
          const marque = p.cible === 'soi' ? '·' : '⚔'
          return `<div class="sort${i === idx ? ' on' : ''}">${p.icone} ${p.nom}<span class="marque">${marque}</span></div>`
        }).join('')
        panneau.innerHTML =
          `<div class="titre">Les dix parchemins</div>${lignes}` +
          `<div class="mode">` +
          `<button data-m="subir" class="${mode === 'subir' ? 'on' : ''}">Subir</button>` +
          `<button data-m="lancer" class="${mode === 'lancer' ? 'on' : ''}">Lancer</button>` +
          `</div>` +
          `<div class="mode seance">` +
          `<button data-g="1" class="${fige ? 'on' : ''}">${fige ? 'Immobile' : 'Figer'}</button>` +
          `<button data-q="1" class="sortie">Quitter</button>` +
          `</div>` +
          `<div class="aide">${EFFETS[TIRAGE[idx]]}</div>` +
          `<div class="aide"><kbd>o</kbd> / <kbd>i</kbd> choisir · <kbd>e</kbd> déclencher<br />` +
          `<kbd>t</kbd> mode · <kbd>f</kbd> figer · <kbd>r</kbd> nettoyer · <kbd>q</kbd> quitter</div>`
        for (const b of panneau.querySelectorAll('.mode button')) {
          b.addEventListener('click', () => {
            if (b.dataset.q) return quitter()
            if (b.dataset.g) return basculerGel()
            mode = b.dataset.m
            appliquer()
          })
        }
      }

      /** Remet le sort choisi en main et redessine. */
      function appliquer() {
        guichet.donner(TIRAGE[idx])
        dessiner()
      }

      function choisir(n) {
        idx = (n + TIRAGE.length) % TIRAGE.length
        appliquer()
      }

      function declencher() {
        if (mode === 'subir') guichet.subir(TIRAGE[idx])
        else guichet.lancer()
        // On se remet le rouleau en main : lancé, il est consommé, et on veut
        // pouvoir recommencer sans re-sélectionner.
        setTimeout(appliquer, 0)
      }

      /** 🍵 Le thé lave tout : c'est le bouton « remise à zéro » du banc. */
      const nettoyer = () => guichet.subir('the')

      function basculerGel() {
        fige = !fige
        guichet.geler(fige)
        dessiner()
      }

      /** On quitte la course et on revient au menu, sans recharger la page. */
      function quitter() {
        guichet.quitter()
        dessiner()
      }

      addEventListener(
        'keydown',
        (e) => {
          if (e.repeat) return
          const k = e.key.toLowerCase()
          if (k === 'o') choisir(idx + 1)
          else if (k === 'i') choisir(idx - 1)
          else if (k === 't') {
            mode = mode === 'subir' ? 'lancer' : 'subir'
            appliquer()
          } else if (k === 'r') nettoyer()
          else if (k === 'e' && mode === 'subir') {
            /*
             * En mode « subir », E ne doit PAS lancer le sort. On intercepte la
             * touche AVANT le jeu (écouteur en phase de capture + arrêt de la
             * propagation) : sans ça le parchemin partirait chez un rival et on
             * ne verrait toujours rien.
             */
            e.stopImmediatePropagation()
            e.preventDefault()
            declencher()
          }
        },
        true
      )

      // ————— Le tableau de bord, rafraîchi à chaque image —————
      // Sans lui, on voit un effet à l'écran sans savoir combien de temps il
      // dure encore, ni ce qui se cumule avec quoi.
      function suivre() {
        requestAnimationFrame(suivre)
        const s = guichet.etat()
        if (!s) return
        const lignes = ETATS.map(([cle, nom, plein]) => {
          const v = s[cle]
          const actif = v > 0.01
          const part = v === Infinity ? 1 : Math.min(1, v / plein)
          const texte =
            v === Infinity ? 'levée' : cle === 'armure' ? `${v}` : actif ? `${v.toFixed(1)}s` : '—'
          return (
            `<div class="ligne${actif ? '' : ' eteint'}"><b>${nom}</b><span class="v">${texte}</span></div>` +
            (actif ? `<div class="jauge" style="width:${(part * 88).toFixed(0)}%"></div>` : '')
          )
        }).join('')
        const treve = s.treve > 0.01 && s.enCourse
        etatEl.innerHTML =
          `<div class="titre">Ce que je subis</div>${lignes}` +
          `<div class="ligne${s.terre ? '' : ' eteint'}"><b>🎯 Terre</b>` +
          `<span class="v">${s.terre ? 'collée' : '—'}</span></div>` +
          `<div class="ligne${treve ? '' : ' eteint'}"><b>👻 Trêve</b>` +
          `<span class="v">${treve ? s.treve.toFixed(1) + 's' : '—'}</span></div>` +
          `<div class="ligne${s.gele ? '' : ' eteint'}"><b>🧪 Piste</b>` +
          `<span class="v">${s.gele ? 'figée' : 'défile'}</span></div>`
      }

      // ————— Le banc de mesure —————
      /*
       * Un sort qui coûte cher ne SE VOIT PAS : il se compte. On ne peut pas
       * dire, à l'œil, que la brume coûte 0,4 ms de plus par image que la
       * fumée du fumigène — on peut le mesurer.
       *
       * ⚠️ Mesure en piste FIGÉE, et c'est voulu : la piste qui défile ajoute
       * du bruit (un mur qui s'approche, un saut), et le comparatif entre deux
       * sorts n'a de sens que si tout le reste est identique. Les effets, eux,
       * continuent d'animer : `gele` fige le monde, pas les minuteurs.
       */
      const IMAGES_MESURE = 40
      let mesuresEnCours = false

      const panneauMesure = document.createElement('div')
      panneauMesure.id = 'mesure'
      document.body.append(panneauMesure)

      function dessinerMesure(lignes, etape) {
        panneauMesure.classList.add('on')
        panneauMesure.innerHTML =
          `<div class="entete"><b>Coût des sorts</b>` +
          `<button id="btnMesurer"${etape ? ' disabled' : ''}>${etape || 'Mesurer'}</button></div>` +
          (lignes
            ? `<table><thead><tr><th>Sort</th><th style="text-align:right">ms / image</th>` +
              `<th style="text-align:right">Sursauts</th><th>Règle</th></tr></thead><tbody>${lignes}</tbody></table>`
            : '') +
          `<div class="suite">${etape || 'Piste figée, trêve passée. Chaque ligne compare ce que coûte une image AVEC le sort à ce qu’il coûte SANS.'}</div>`
        const b = panneauMesure.querySelector('#btnMesurer')
        if (b) b.addEventListener('click', () => mesurer())
      }

      /** Une image, chronométrée entre deux rAF. */
      function uneImage() {
        return new Promise((r) => {
          const t0 = performance.now()
          requestAnimationFrame(() => r(performance.now() - t0))
        })
      }

      /** Attends que la trêve du départ soit finie, sinon les sorts partent en fumée. */
      async function attendreTreve() {
        for (let i = 0; i < 900; i++) {
          if ((guichet.etat()?.treve ?? 0) <= 0) return true
          await uneImage()
        }
        return false
      }

      /*
       * ⚠️ DEUX pièges, tous deux découverts en mesurant — et ils faussaient
       * le tableau entier.
       *
       * 1. LE MONTEUR NOUS LIMITE À 60 IMAGES/S. Les écarts tombent tous à
       *    16,67 ms : le navigateur ATTEND la balayage, il ne travaille pas
       *    plus longtemps. Un sort qui coûte 0,4 ms ne bouge donc RIEN, tant
       *    qu'il ne fait pas déborder le budget. Chercher une différence sur la
       *    médiane est stérile — c'est le SURALLOCATION qu'il faut compter.
       *
       * 2. UN SORT « SUR SOI » ne passe pas par `subir`. Vent, Grue, Armure,
       *    Thé et Miroir sont des sorts que l'on LANCE : `subirSort` ne les
       *    connaît pas et les refuse en silence. On mesurait alors le coût de
       *    rien du tout, et le banc déclarait « refusé » cinq sorts sur dix —
       *    le banc avait raison, c'est le banc qui les appelait mal.
       */
      async function chronometrer() {
        for (let i = 0; i < 10; i++) await uneImage()
        const e = []
        for (let i = 0; i < IMAGES_MESURE; i++) e.push(await uneImage())
        const s = [...e].sort((x, y) => x - y)
        const med = s[s.length >> 1]
        const p95 = s[Math.min(s.length - 1, Math.floor(s.length * 0.95))]
        // Un « sursaut » = une image au moins 1,5× plus longue que la médiane.
        // C'est ça, et non la médiane, que le joueur voit.
        const seuil = med * 1.5
        const sursauts = e.filter((v) => v > seuil).length
        return { med, p95, sursauts }
      }

      const fmt = (v) => v.toFixed(2)

      /** Est-ce que ce sort est encore en cours juste après son déclenchement ? */
      function applique(k, s) {
        if (!s) return false
        if (k === 'onmyoji') return true // il échange et disparaît : rien à lire
        if (k === 'kunai') return s.terre === true // la lame a marqué le sol
        if (k === 'armure') return s.armure > 0
        if (k === 'miroir') return s.miroir > 0
        // Les cinq à durée : vent, grue, thé, kusarigama, fumigene, senbon
        return (s[k] ?? 0) > 0
      }

      /** Un sort SUR SOI se lance, un sort SUR AUTRUI se subit. */
      function declencherSort(k) {
        guichet.donner(k)
        if (PARCHEMINS[k].cible === 'soi') guichet.lancer()
        else guichet.subir(k)
      }

      async function mesurer() {
        if (mesuresEnCours) return
        mesuresEnCours = true
        const lignes = []

        // On repart d'une page blanche : piste figée, rien qui te tombe dessus.
        fige = true
        guichet.geler(true)
        guichet.oublier()
        dessinerMesure(null, 'Attente de la trêve du départ…')
        const passe = await attendreTreve()
        if (!passe) {
          dessinerMesure(null, '⛔ La trêve du départ ne se termine jamais — lance une course d\'abord.')
          mesuresEnCours = false
          return
        }

        // ——— Le silence : ce que coûte une image quand rien ne se passe ———
        guichet.oublier()
        const ref = await chronometrer()
        lignes.push(
          `<tr class="ok"><td>— rien (référence)</td><td class="num">${fmt(ref.med)}</td>` +
            `<td class="num">${ref.sursauts}</td><td>référence</td></tr>`
        )
        dessinerMesure(lignes.join(''), `Mesure des sorts…`)

        // ——— Chaque sort ———
        let refuses = 0
        for (const k of TIRAGE) {
          guichet.oublier()
          declencherSort(k)
          const m = await chronometrer()
          const p = PARCHEMINS[k]
          const ok = applique(k, guichet.etat())
          if (!ok) refuses++
          const nomRegle = ok ? (p.cible === 'soi' ? 'lancé' : 'subi') : '⛔ refusé'
          // Le verdict se joue sur le nombre de sursauts, pas sur la médiane.
          const sur = m.sursauts - ref.sursauts
          const verdict = sur > 2 ? `⛔ +${sur} sursauts` : sur > 0 ? `+${sur} sursaut` : 'propre'
          lignes.push(
            `<tr class="${sur > 2 || !ok ? 'mauvais' : ''}"><td>${p.icone} ${p.nom}</td>` +
              `<td class="num">${fmt(m.med)}</td><td class="num">${verdict}</td><td>${nomRegle}</td></tr>`
          )
          dessinerMesure(lignes.join(''), `Mesure des sorts… ${TIRAGE.indexOf(k) + 1}/${TIRAGE.length}`)
          guichet.oublier()
        }

        // ——— Le cumul : DEUX rouleaux en main, comme en vraie course ———
        guichet.oublier()
        guichet.donner('armure', 'senbon')
        guichet.lancer() // l'armure : c'est un sort SUR SOI
        guichet.subir('senbon') // le poison : c'est un sort SUR AUTRUI
        const cum = await chronometrer()
        const sc = guichet.etat()
        /*
         * ⚠️ Deux règles d'un coup. L'armure doit TENIR une charge et le
         * poison doit tourner EN MÊME TEMPS — si l'un chasse l'autre, le
         * cumul est cassé, et c'est EXACTEMENT le symptôme décrit : « j'ai un
         * sort qui bug quand j'en ai deux ».
         */
        const cumulOk = (sc?.armure ?? 0) >= 1 && (sc?.senbon ?? 0) > 0
        const surCum = cum.sursauts - ref.sursauts
        lignes.push(
          `<tr class="${cumulOk && surCum <= 2 ? '' : 'mauvais'}"><td>🛡️+☠️ cumul (2 sorts)</td>` +
            `<td class="num">${fmt(cum.med)}</td><td class="num">${surCum > 0 ? `+${surCum} sursaut` : 'propre'}</td>` +
            `<td>${
              cumulOk
                ? 'les deux tiennent'
                : `⛔ armure=${sc?.armure} poison=${fmt(sc?.senbon ?? 0)}s`
            }</td></tr>`
        )

        // ——— Le FIFO : on lance le plus ancien d'abord ———
        guichet.oublier()
        guichet.donner('vent', 'grue')
        guichet.lancer()
        const restant = guichet.etat()?.slots?.length ?? -1
        const fifoOk = restant === 1
        lignes.push(
          `<tr class="${fifoOk ? '' : 'mauvais'}"><td>📜 FIFO des 2 slots</td>` +
            `<td class="num">—</td><td class="num">—</td>` +
            `<td>${fifoOk ? 'le plus ancien part' : `⛔ il en reste ${restant}`}</td></tr>`
        )

        guichet.oublier()
        guichet.geler(fige)
        dessinerMesure(
          lignes.join(''),
          `Référence ${fmt(ref.med)} ms/image, ${ref.sursauts} sursaut(s). ` +
            `${refuses} sort(s) refusé(s), cumul ${cumulOk ? 'OK' : 'CASSÉ'}, FIFO ${fifoOk ? 'OK' : 'CASSÉ'}. ` +
            `⚠️ Le moniteur plafonne à 60 images/s : un coût qui ne déborde pas le budget ne se voit pas ici, ` +
            `il se voit en sursauts.`
        )
        mesuresEnCours = false
      }

      dessinerMesure(null)

      // On redonne le sort tenu à chaque nouvelle course : `startRace` vide les
      // slots, et sans ça on repartirait les mains vides sans comprendre.
      // On redonne le sort ET on refige à chaque nouvelle course : `startRace`
      // repart d'une piste neuve, sans rien savoir du banc d'essai.
      const btnGo = document.getElementById('btnGo')
      if (btnGo)
        btnGo.addEventListener('click', () =>
          setTimeout(() => {
            appliquer()
            guichet.geler(fige)
          }, 0)
        )

      appliquer()
      guichet.geler(fige)
      suivre()

      /*
       * `?auto=1` : la course démarre et la mesure s'enchaîne toute seule.
       *
       * C'est la porte des navigateurs de test — et la seule façon de vérifier
       * ce banc sans cliquer à la main. Même idée que `diagnostic.html?auto=1`.
       */
      if (new URLSearchParams(location.search).has('auto')) {
        guichet.demarrer()
        setTimeout(() => {
          fige = true
          guichet.geler(true)
          void mesurer()
        }, 500)
      }
    </script>
  </body>
